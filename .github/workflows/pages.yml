name: Build Wasm & Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WebAssembly Solver
    runs-on: ubuntu-24.04

    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ccache
          fi

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Cache CMake Wasm dependencies
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps
          key: >-
            wasm-deps-v3-${{ runner.os }}-${{
            hashFiles('CMakeLists.txt', 'third_party/patch_dds.py') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >-
            ccache-wasm-v2-${{ runner.os }}-${{
            hashFiles('CMakeLists.txt', 'third_party/patch_dds.py',
            'third_party/gen_sayc_bids.py', '*.cc', '*.h', 'web/*.cc',
            'web/*.h', 'perf/*.cc') }}
          restore-keys: |
            ccache-wasm-v2-${{ runner.os }}-

      - name: Configure and build bridge_wasm
        run: |
          ccache -z
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j "$(nproc)"
          ccache -s

      - name: Smoke-test bridge_wasm in Node.js
        run: |
          node -e '(() => {
            const fs = require("fs");
            const path = require("path");
            const vm = require("vm");
            let ran = false;
            process.on("exit", () => {
              if (!ran) {
                console.error("Wasm smoke test did not run!");
                process.exitCode = 1;
              }
            });
            const wasmJs = path.resolve("build-wasm/bridge_wasm.js");
            global.require = require;
            global.__filename = wasmJs;
            global.__dirname = path.dirname(wasmJs);
            global.self = global;
            const statuses = [];
            global.self.onBridgeSolverProgress = (st, prog) => {
              statuses.push({ st, prog });
            };
            global.Module = {
              locateFile: (p) => path.resolve("build-wasm", p),
              onRuntimeInitialized() {
                setImmediate(() => {
                  const req1 = JSON.stringify({
                    hands: {
                      N: "S AQ; H -; D -; C -;",
                      E: "S 54; H -; D -; C -;",
                      S: "S 87; H -; D -; C -;",
                      W: "S KJ; H -; D -; C -;"
                    },
                    trump: "SPADES",
                    leader: "NORTH",
                    min_tricks: 1,
                    num_iters: 4,
                    num_threads: 4
                  });
                  const out1 = JSON.parse(global.Module.ccall(
                    "wasm_solve_json", "string", ["string"], [req1]
                  ));
                  if (!out1.success || out1.tricks_won !== 1 ||
                      out1.best_lead !== "SA" || out1.num_threads !== 4) {
                    console.error("Unexpected Wasm solve output 1:", out1);
                    process.exit(1);
                  }
                  const req2 = JSON.stringify({
                    hands: {
                      N: "S AJ8765; H J85; D -; C KJ86;",
                      E: "S -; H AKQ; D -; C -;",
                      S: "S KT9; H 93; D AQ853; C AQ9;",
                      W: "S -; H 642; D -; C -;"
                    },
                    unknown_cards: "S Q432 H T7 D KJT97642 C T75432",
                    trump: "SPADES",
                    leader: "EAST",
                    cur_trick: ["HA"],
                    min_tricks: 11,
                    num_iters: 2,
                    num_threads: 4,
                    requirements: {
                      E: { would_bid: [{ bid: "X", after: "P 1S" }] },
                      W: { would_bid: [{ bid: "P", after: "" }] }
                    }
                  });
                  const out2 = JSON.parse(global.Module.ccall(
                    "wasm_solve_json", "string", ["string"], [req2]
                  ));
                  if (!out2.success || out2.tricks_won !== 11) {
                    console.error("Unexpected Wasm solve output 2:", out2);
                    process.exit(1);
                  }
                  ran = true;
                  console.log(
                    "Wasm smoke test passed:", out1.best_lead,
                    "Hand 6 solve_ms:", out2.solve_ms,
                    "threads:", out2.num_threads, "statuses:", statuses.length
                  );
                  process.exit(0);
                });
              }
            };
            vm.runInThisContext(
              fs.readFileSync(wasmJs, "utf8"), { filename: wasmJs }
            );
          })()'

      - name: Assemble static site bundle
        run: |
          mkdir -p _site _site/images
          cp web/static/index.html _site/
          cp web/static/help.html _site/
          cp web/static/styles.css _site/
          cp web/static/app.js _site/
          cp web/static/solver_worker.js _site/
          cp web/static/coi_serviceworker.js _site/
          cp web/presets.json _site/
          cp docs/bridge-strategy.md _site/bridge-strategy.md
          cp docs/user-guide.md _site/user-guide.md
          cp -r docs/images/* _site/images/
          cp build-wasm/bridge_wasm.js _site/
          cp build-wasm/bridge_wasm.wasm _site/
          if [ -f build-wasm/bridge_wasm.worker.js ]; then
            cp build-wasm/bridge_wasm.worker.js _site/
          fi
          VER="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${VER}\"|g; s|src=\"app.js\"|src=\"app.js?v=${VER}\"|g" _site/index.html
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${VER}\"|g; s|'bridge-strategy.md'|'bridge-strategy.md?v=${VER}'|g; s|'user-guide.md'|'user-guide.md?v=${VER}'|g" _site/help.html
          sed -i "s|'presets.json'|'presets.json?v=${VER}'|g; s|'solver_worker.js'|'solver_worker.js?v=${VER}'|g; s|'bridge-strategy.md'|'bridge-strategy.md?v=${VER}'|g; s|'user-guide.md'|'user-guide.md?v=${VER}'|g" _site/app.js
          sed -i "s|'bridge_wasm.js'|'bridge_wasm.js?v=${VER}'|g" \
            _site/solver_worker.js
          sed -i "s|'bridge_wasm.wasm'|'bridge_wasm.wasm?v=${VER}'|g" \
            _site/solver_worker.js
          touch _site/.nojekyll
          ls -lh _site/ _site/images/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-wasm
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
