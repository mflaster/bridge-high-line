name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-11, g++-12]

    env:
      DEBIAN_FRONTEND: noninteractive
      CXX: ${{ matrix.compiler }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            ${{ matrix.compiler }} \
            libcatch2-dev \
            libgoogle-glog-dev \
            libboost-all-dev \
            libomp-dev \
            cmake \
            make

      - name: Cache CMake build dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Build and Run Tests
        run: |
          make run_all_tests
